<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Combusting Note - {{ .Title }}</title>
		<link rel="stylesheet"
			href="/stylesheets/main.css">
		<link id="favicon"
			rel="shortcut icon"
			href="/debris/favicon/favicon.ico">
		<script>
			MathJax = {
				chtml: {
					matchFontHeight: false
				},
				tex: {
					tags: 'ams',
					inlineMath: [['$', '$']],
					displayMath: [['\[', '\]']]
				}
			};
		</script>
		<script id="MathJax-script"
			async
			src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
			</script>
	</head>
	<body>
		<h1>{{ .Title }}</h1>
		<note-info>
			<info-block>
				<p> 記録者: {{ .Params.author }}</p>
				<p> 日時: {{ .Date.Format "2006/01/02" }}</p>
			</info-block>
			<info-block>
				<p>カテゴリ:</p>
				{{ range .GetTerms "categories" }}
				<category>{{ .Title }}</category>
				{{ end }}
			</info-block>
		</note-info>
		<contents>
			{{ .Content }}
		</contents>
		<a href="/windows/notes.html">notes</a>
		<a href="/index.html">top</a>
		<footer>
			&copy; Copyright 2025, Schzna
		</footer>
	</body>
</html>
